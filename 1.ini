1. Ở mmàn test Visual Search thì sẽ có thêm config khác là Click thôi, tức là nếu ở chế độ click thì khi người dùng click vào các điểm thì nó nhảy sang chế độ xanh luôn, coi như điểm đó hoàn thành luôn rồi.
2. Ở màn test Anti-Saccade thì cái hướng mà primary rectangle di chuyển sẽ random. Tức là giả sử cái trial count là 8 thì sẽ lần 1 nó sẽ sang trái, lần 2 nó sang phải, lần 3 lại sang phải, lần 4 lên trên....tức là hoàn toàn random.
3. Đổi thứ tự của pre-questionnaire lên trước cả Calibration. 
